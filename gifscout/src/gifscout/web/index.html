<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GifScout — find any moment, cut any GIF</title>
<style>
  :root {
    --bg: #f4f1ea; --ink: #23211c; --muted: #79736a;
    --accent: #c2552b; --card: #fffdf8; --line: #e2dcd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 Georgia, "Times New Roman", serif;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 2.4rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h1 em { color: var(--accent); font-style: italic; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  form.search {
    display: grid; grid-template-columns: 1fr; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px;
  }
  label { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  input[type=text] {
    width: 100%; padding: 12px 14px; font: inherit;
    border: 1px solid var(--line); border-radius: 9px; background: #fff;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    justify-self: start; padding: 11px 26px; font: inherit; font-style: italic;
    background: var(--accent); color: #fff; border: 0; border-radius: 9px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  #status { margin: 18px 2px; color: var(--muted); font-style: italic; min-height: 1.4em; }
  .plan { font-size: .9rem; color: var(--muted); margin: 0 2px 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #ddd; }
  .meta { padding: 10px 12px; font-size: .85rem; color: var(--muted); display: flex; justify-content: space-between; }
  .card button { margin: 0 12px 12px; padding: 8px 14px; font-size: .9rem; }
  .gif-out { margin-top: 28px; text-align: center; }
  .gif-out img { max-width: 100%; border-radius: 12px; border: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Gif<em>Scout</em></h1>
  <p class="sub">Describe a moment from your movie or clip — get it back as a GIF.</p>

  <form class="search" id="form">
    <div>
      <label for="source">Video path or URL (on the server)</label>
      <input type="text" id="source" placeholder="/path/to/movie.mp4" required>
    </div>
    <div>
      <label for="query">The moment you want</label>
      <input type="text" id="query" placeholder="she throws her hands up and laughs" required>
    </div>
    <button id="go">Find moments</button>
  </form>

  <p id="status"></p>
  <p class="plan" id="plan"></p>
  <div class="grid" id="results"></div>
  <div class="gif-out" id="gifout"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const form = $("form"), status_ = $("status"), results = $("results");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  results.innerHTML = ""; $("gifout").innerHTML = ""; $("plan").textContent = "";
  status_.textContent = "Indexing & searching… first run on a new video can take a while.";
  try {
    const resp = await fetch("/api/search", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ source: $("source").value, query: $("query").value, top_k: 6 }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || resp.statusText);
    const data = await resp.json();
    status_.textContent = data.matches.length ? "Pick a moment to cut as a GIF:" : "No matches found.";
    if (data.visual_queries.length > 1)
      $("plan").textContent = "Interpreted as: " + data.visual_queries.join(" · ");
    for (const m of data.matches) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${m.thumbnail || ""}" alt="">
        <div class="meta"><span>${m.start.toFixed(1)}s – ${m.end.toFixed(1)}s</span>
        <span>score ${m.score.toFixed(2)}</span></div>`;
      const btn = document.createElement("button");
      btn.textContent = "Make GIF";
      btn.onclick = () => makeGif(m, data.suggested_caption, btn);
      card.appendChild(btn);
      results.appendChild(card);
    }
  } catch (err) {
    status_.textContent = "Error: " + err.message;
  } finally {
    $("go").disabled = false;
  }
});

async function makeGif(m, caption, btn) {
  btn.disabled = true; btn.textContent = "Rendering…";
  try {
    const resp = await fetch("/api/gif", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ source: m.video, start: m.start, end: m.end, caption: caption || null }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || resp.statusText);
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    $("gifout").innerHTML = `<img src="${url}" alt="GIF"><br>
      <a href="${url}" download="gifscout.gif">Download GIF</a>`;
    $("gifout").scrollIntoView({ behavior: "smooth" });
  } catch (err) {
    status_.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false; btn.textContent = "Make GIF";
  }
}
</script>
</body>
</html>

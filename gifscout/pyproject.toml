[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gifscout"
version = "0.1.0"
description = "AI that finds and extracts any GIF-able moment from movies and clips using natural language."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rohith Illuri" }]
keywords = ["gif", "video", "clip", "semantic-search", "ffmpeg", "ai"]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Semantic search with real CLIP embeddings (recommended for production)
ml = [
    "torch>=2.1",
    "open-clip-torch>=2.24",
]
# Web server + UI
server = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
# Download videos from URLs
ingest = ["yt-dlp>=2024.4.9"]
# Claude-powered query understanding and reranking
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.110",
]
all = ["gifscout[ml,server,ingest,llm]"]

[project.scripts]
gifscout = "gifscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gifscout = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
